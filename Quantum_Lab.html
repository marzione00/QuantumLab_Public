:root {
  --background: #f5f5f0;
  --foreground: #25343b;
  --card: #fff;
  --card-foreground: #25343b;
  --popover: #fff;
  --popover-foreground: #25343b;
  --primary: #9c2942;
  --primary-foreground: #fff;
  --secondary: #eef2f7;
  --secondary-foreground: #35475e;
  --muted: #e8edf3;
  --muted-foreground: #626f80;
  --accent: #edf2f8;
  --accent-foreground: #25343b;
  --destructive: #9c2942;
  --border: #d7dfdf;
  --input: #d3dce6;
  --ring: #9c294260;
  --radius: .6rem;
  --sidebar: #fff;
  --sidebar-foreground: #35475e;
  --sidebar-primary: #9c2942;
  --sidebar-primary-foreground: #fff;
  --sidebar-accent: #f8edf0;
  --sidebar-accent-foreground: #a11b2d;
  --sidebar-border: #e1e7ef;
  --sidebar-ring: #9c294260;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: Arial,Helvetica,sans-serif;
  font-size: 16px;
  line-height: 1.55;
}
button,a,input,summary {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
}
a {
  color: inherit;
}
button:focus-visible,a:focus-visible,summary:focus-visible {
  outline: 3px solid #9c294270;
  outline-offset: 3px;
}
.workspace {
  min-width: 0;
  flex: 1;
}
.topbar {
  height: 72px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 44px;
  background: #ffffffb0;
}
.course-name {
  font-size: 12px;
  letter-spacing: .16em;
  color: #627084;
  font-weight: 700;
}
.top-actions {
  display: flex;
  gap: 22px;
  align-items: center;
}
.pdf-link {
  display: flex;
  gap: 8px;
  align-items: center;
  text-decoration: none;
  font-size: 14px;
}
.pdf-link:hover {
  color: var(--primary);
}
.brand {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 24px 22px 32px;
  color: var(--primary);
}
.brand strong {
  display: block;
  color: #25343b;
  font-family: Georgia,serif;
  font-weight: 400;
  font-size: 25px;
  letter-spacing: -.6px;
}
.brand span {
  display: block;
  font-size: 12px;
  letter-spacing: .08em;
  color: #697689;
}
.nav-eyebrow {
  font-size: 11px;
  letter-spacing: .15em;
  font-weight: 700;
  color: #758194;
  padding: 7px 26px 14px;
}
.lab-sidebar [data-slot=sidebar-content] {
  padding: 0 12px;
}
.chapter-link {
  height: auto !important;
  min-height: 49px !important;
  padding: 12px 12px !important;
  font-size: 14px !important;
  line-height: 1.4;
  white-space: normal !important;
  border-radius: 7px !important;
  gap: 12px !important;
}
.chapter-link>span:last-child {
  white-space: normal !important;
}
.chapter-number {
  font-size: 12px;
  color: #8490a1;
  min-width: 20px;
  font-variant-numeric: tabular-nums;
  letter-spacing: .06em;
}
.chapter-link[data-active=true] {
  background: #f8edf0 !important;
  color: #a11b2d !important;
  font-weight: 600;
}
.chapter-link[data-active=true] .chapter-number {
  color: #9c2942;
}
.chapter-marker {
  margin-left: auto;
  width: 4px;
  min-width: 4px;
  height: 19px;
  border-radius: 3px;
  background: var(--primary);
}
.lab-sidebar [data-slot=sidebar-footer] {
  padding: 24px 25px;
}
.sidebar-note {
  font-family: Georgia,serif;
  font-size: 18px;
  line-height: 1.4;
  color: #67788e;
}
.sidebar-rule {
  height: 2px;
  width: 36px;
  background: var(--primary);
  margin: 18px 0 8px;
}
.sidebar-credit {
  font-size: 12px;
  color: #536770;
}
.page-content {
  max-width: 1550px;
  margin: auto;
  padding: 30px 40px 18px;
}
.section-label {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #657389;
}
.section-label>span:first-child {
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--primary);
  font-weight: 700;
}
.label-divider {
  height: 13px;
  width: 1px;
  background: #bbc6d3;
}
.chapter-heading h1 {
  font-family: Georgia,'Times New Roman',serif;
  font-size: clamp(28px,2.7vw,42px);
  font-weight: 400;
  line-height: 1.17;
  letter-spacing: -.9px;
  margin: 12px 0 9px;
}
.opening-question {
  color: #667487;
  margin: 0 0 27px;
  font-size: 16px;
  max-width: 860px;
}
.experiment-layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 266px;
  gap: 22px;
  align-items: start;
}
.experiment-surface {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 22px #25324a05;
  min-width: 0;
}
.figure-heading {
  padding: 17px 23px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid #edf0f5;
  font-size: 11px;
  letter-spacing: .1em;
  font-weight: 700;
  color: #68778b;
}
.figure-tag {
  font-size: 12px;
  letter-spacing: 0;
  font-weight: 400;
  background: #eef3f9;
  padding: 3px 9px;
  border-radius: 20px;
  color: #516781;
  white-space: nowrap;
}
.stage {
  position: relative;
  background: #fbfcfe;
}
.stage>svg {
  display: block;
  width: 100%;
  height: auto;
}
.stage svg text {
  font-family: Arial,sans-serif;
}
.svg-title {
  font-size: 18px;
  font-weight: 500;
  fill: #3b506b;
}
.control-panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 22px 21px;
}
.panel-heading {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 23px;
}
.control {
  margin-bottom: 24px;
}
.control:last-child {
  margin-bottom: 0;
}
.control-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 9px;
  font-size: 14px;
  margin-bottom: 17px;
}
.control-label label {
  line-height: 1.35;
}
.control-label output {
  font-size: 15px;
  color: var(--primary);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.range-extents {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #788698;
  margin-top: 8px;
}
.select-label {
  font-size: 14px;
  display: block;
  margin-bottom: 10px;
}
.lab-select {
  width: 100% !important;
  min-height: 40px;
  font-size: 14px !important;
  white-space: normal !important;
}
.lab-segments {
  display: flex !important;
  width: 100% !important;
  gap: 1px !important;
  height: auto !important;
  padding: 3px !important;
}
.lab-segments button {
  padding: 7px 5px !important;
  font-size: 13px !important;
  min-height: 34px;
  white-space: normal !important;
}
.control-tip {
  font-size: 14px;
  line-height: 1.6;
  color: #657389;
  border-top: 1px solid #e3e8ef;
  padding-top: 17px;
  margin-top: 8px;
}
.experiment-actions {
  padding: 16px 22px;
  border-top: 1px solid #e6ebf2;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
}
.experiment-actions button {
  font-size: 14px;
  min-height: 38px;
}
.button-cluster {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.trial-total {
  margin-left: auto;
  font-size: 13px;
  color: #667487;
  font-variant-numeric: tabular-nums;
}
.results {
  padding: 18px 24px 20px;
  border-top: 1px solid #e8edf3;
}
.result-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}
.result-heading h3 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}
.pin-button {
  font-size: 12px !important;
  height: 29px !important;
  padding: 0 7px !important;
  color: #6a788b;
}
.probability-row {
  display: grid;
  grid-template-columns: 32px minmax(50px,1fr) 47px 48px;
  gap: 12px;
  align-items: center;
  min-height: 29px;
  font-size: 14px;
}
.bar-track {
  height: 12px;
  border-radius: 3px;
  background: #eef2f7;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 3px;
  background: #166477;
  transition: width .25s;
}
.series-1,.series-3 {
  background: #a76010;
}
.series-2 {
  background: #627baa;
}
.theory-marker {
  position: absolute;
  height: 20px;
  width: 2px;
  top: -4px;
  background: #27394e;
  transform: translateX(-1px);
}
.outcome-count {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.outcome-prob {
  text-align: right;
  color: #6c7a8d;
  font-variant-numeric: tabular-nums;
}
.result-legend {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 12px;
  color: #68768a;
  padding-top: 11px;
}
.result-legend>span {
  display: flex;
  align-items: center;
  gap: 7px;
}
.legend-filled {
  display: inline-block;
  width: 12px;
  height: 8px;
  background: #166477;
}
.legend-tick {
  display: inline-block;
  width: 2px;
  height: 12px;
  background: #27394e;
  margin: 0 5px;
}
.saved-comparison {
  border-top: 1px solid var(--border);
  margin-top: 16px;
  padding-top: 14px;
  font-size: 13px;
  color: #627084;
}
.saved-comparison>strong {
  display: block;
  font-size: 13px;
  color: #354b67;
}
.saved-comparison>div {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 7px;
}
.observation {
  display: grid;
  grid-template-columns: 122px 1fr;
  gap: 18px;
  margin: 24px 3px 15px;
  max-width: 1180px;
}
.observation>span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--primary);
  padding-top: 5px;
}
.observation p {
  margin: 0;
  font-size: 15px;
  line-height: 1.7;
  color: #536479;
}
.observation strong {
  font-weight: 600;
  color: #344a65;
}
.model-details {
  margin: 0 3px 15px;
  font-size: 14px;
  color: #66778d;
  max-width: 1180px;
}
.model-details summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  width: fit-content;
}
.model-details[open] summary svg {
  transform: rotate(180deg);
}
.model-details>div {
  background: #edf2f8;
  border-radius: 8px;
  padding: 16px 20px;
  line-height: 1.75;
}
.model-details p {
  margin: 0 0 9px;
}
.model-details p:last-child {
  margin-bottom: 0;
}
.page-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  margin-top: 24px;
  padding-top: 13px;
  color: #5a6b80;
}
.page-footer button {
  font-size: 13px;
}
.reset-lab {
  font-size: 12px !important;
  background: none;
  border: 0;
  color: #536770;
  padding: 8px;
}
.mobile-menu {
  display: none !important;
}
.stats-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  padding: 16px 24px;
  border-top: 1px solid #e7edf5;
}
.small-stat {
  flex: 1;
  min-width: 105px;
}
.small-stat>span {
  display: block;
  font-size: 12px;
  color: #6a798d;
}
.small-stat>strong {
  display: block;
  font-size: 23px;
  line-height: 1.5;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: #304966;
}
.small-stat>small {
  font-size: 12px;
  color: #79869a;
}
.switch-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  margin-bottom: 24px;
}
.control-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.control-actions button {
  white-space: normal;
  height: auto;
  min-height: 40px;
  font-size: 13px;
}
.stage-caption {
  padding: 9px 21px 14px;
  font-size: 12px;
  color: #6a7a8e;
  background: #fbfcfe;
}
.joint-grid {
  display: grid;

.sample-interval {

  border-right: 2px solid #243b59;
  min-width: 2px;
  z-index: 2;
}

  content: '';
  position: absolute;
  top: -4px;
  height: 10px;
  border-left: 1px solid #243b59;
}
.sample-interval:before {
  left: 0;
}
.sample-interval:after {
  right: 0;

.outcome-count,.outcome-prob {

:root {
  --background: #f5f5f0;
  --foreground: #25343b;
  --primary: #9c2942;
  --secondary: #edf2f1;
  --muted: #e8edeb;
  --muted-foreground: #52636b;
  --accent: #f1f2eb;
  --border: #d7dfdf;
  --sidebar: #163f4c;
  --sidebar-foreground: #f7f8f5;
  --sidebar-accent: #f8f5ed;
  --sidebar-accent-foreground: #7c2339;
  --sidebar-border: #315561;
  --sidebar-primary: #fff;
  --sidebar-ring: #e4b571;
}
body {
  line-height: 1.65;
  background: #f5f5f0;
  color: #25343b;
}
.topbar {
  background: #fff;
  border-bottom-color: #d7dfdf;
}
.topbar,.page-content {
  padding-left: 34px;
  padding-right: 34px;
}
.page-content {
  padding-top: 31px;
  padding-bottom: 22px;
}
.chapter-heading h1 {
  color: #223d47;
  letter-spacing: -.035em;
  font-size: clamp(30px,2.65vw,43px);
  line-height: 1.2;
  margin: 14px 0 13px;
}
.opening-question {
  font-size: 17px;
  line-height: 1.65;
  color: #4b6068;
  margin-bottom: 17px;
  max-width: 82ch;
}
.lab-introduction {
  font-size: 17px;
  line-height: 1.8;
  color: #334a53;
  max-width: 83ch;
  margin-bottom: 18px;
}
.lab-sidebar {
  --sidebar: #163f4c;
  --sidebar-foreground: #f7f8f5;
}

  background: #163f4c;

.reading-nav {
  display: flex;
  gap: 0;
  flex-wrap: wrap;
  margin: 0 0 25px;
  border-top: 1px solid #d7dfdf;
  border-bottom: 1px solid #d7dfdf;
  width: fit-content;
}
.reading-nav button {
  font: inherit;
  font-size: 14px;
  color: #166477;
  background: transparent;
  border: 0;
  padding: 10px 18px 10px 0;
  margin-right: 18px;
  line-height: 1.45;
}
.reading-nav button:hover {
  text-decoration: underline;
  text-underline-offset: 4px;
}
.reading-nav button:last-child {
  margin-right: 0;
  padding-right: 0;
}
#esperimento,#regolazioni,#lettura-risultato {
  scroll-margin-top: 20px;
}
.experiment-layout {
  grid-template-columns: minmax(0,1fr) 310px;
  gap: 24px;
}
.experiment-surface {
  border-radius: 8px;
  box-shadow: 0 5px 22px #203c4606;
}
.stage {
  background: #fcfcf8;
}
.figure-heading {
  font-size: 12px;
  letter-spacing: .06em;
  color: #38515a;
  border-bottom: 1px solid #d7dfdf;
  background: #f3f6f3;
  padding: 19px 24px;
}
.figure-tag {
  font-size: 13px;
  background: #e7efed;
  color: #33575f;
  border-radius: 4px;
  padding: 4px 8px;
  white-space: normal;
}
.figure-explanation {
  padding: 23px 26px 24px;
  background: #fcfcf8;
  border-top: 1px solid #d7dfdf;
  border-bottom: 1px solid #d7dfdf;
}
.figure-explanation h3 {
  font-family: Georgia,'Times New Roman',serif;
  font-size: 23px;
  font-weight: 400;
  line-height: 1.35;
  color: #214a56;
  margin: 0 0 13px;
}
.figure-explanation p,.result-reading,.sampling-note,.analysis-note,.analysis-note p {
  font-size: 16px;
  line-height: 1.8;
  color: #344c55;

}
.figure-explanation p:last-child,.analysis-note p:last-child {

}
.figure-explanation strong,.sampling-note strong {
  color: #243d45;
  font-weight: 600;
}
.control-panel {
  border-radius: 8px;
  background: #fffdf9;
  border-top: 3px solid #a76010;
  padding: 23px;
}
.panel-heading {
  font-family: Georgia,'Times New Roman',serif;
  font-size: 23px;
  font-weight: 400;
  color: #663b12;
  margin-bottom: 24px;
}
.control {
  margin-bottom: 25px;
  padding-bottom: 3px;
}
.control-label {
  font-size: 15px;
  align-items: flex-start;
  margin-bottom: 13px;
  line-height: 1.45;
}
.control-label label {
  line-height: 1.45;
}
.control-label output {
  font-size: 15px;
  font-weight: 600;
  color: #8b273e;
}
.select-label {
  font-size: 15px;
  line-height: 1.45;
}
.range-extents {
  font-size: 13px;
  color: #596c73;
}
.lab-select {
  font-size: 14px !important;
  background: #fff;
  line-height: 1.5;
  padding-top: 9px;
  padding-bottom: 9px;
}
.control-explanation {
  font-size: 14px;
  line-height: 1.7;
  color: #506169;
  margin: 11px 0 0;
}
.control-tip {
  font-size: 15px;
  line-height: 1.8;
  color: #445961;
  border-top-color: #d7dfdf;
}
.control-actions button {
  font-size: 14px;
  padding-top: 10px;
  padding-bottom: 10px;
}
.control-panel [data-slot=slider-track] {
  background: #e2e6df;
}
.control-panel [data-slot=slider-range] {
  background: #9c2942;
}
.lab-segments {
  background: #eef0e9 !important;
}
.lab-segments button {
  font-size: 14px !important;
  padding: 8px !important;
}
.lab-segments [data-state=active] {
  color: #7f233b !important;
  background: #fff !important;
}
.switch-control {
  font-size: 15px;
  line-height: 1.6;
}
.switch-control label {
  flex: 1;
}
.results {
  padding: 23px 26px;
}
.result-heading h3 {
  font-size: 19px;
  color: #24444e;
}
.result-actions button {
  font-size: 14px;
}
.result-reading {
  margin-bottom: 20px;
}
.probability-row {
  grid-template-columns: 56px minmax(65px,1fr) 76px 82px;
  gap: 12px;
  min-height: 36px;
  font-size: 15px;
}
.result-columns {
  font-size: 12px;
  color: #52636b;
  align-items: end;
  line-height: 1.4;
  padding-bottom: 9px;
}
.result-columns span:nth-child(n+3) {
  text-align: right;
}
.bar-track {
  height: 14px;
  background: #edf1ed;
  border-radius: 2px;
}
.bar-fill {
  background: #166477;
  border-radius: 2px;
}
.series-1,.series-3 {
  background: #a76010;
}
.series-2 {
  background: #406773;
}
.theory-marker {
  background: #25343b;
  height: 24px;
  top: -5px;
}
.outcome-prob {
  color: #334b54;
}
.outcome-count {
  color: #263f47;
}
.sampling-note {
  margin-top: 17px;
}
.statistical-detail,.numerical-detail {
  font-size: 15px;
  line-height: 1.8;
  color: #3b515a;
  margin: 20px 0 5px;
  border-top: 1px solid #d7dfdf;
  padding: 15px 0 0;
}
.statistical-detail summary,.numerical-detail summary {
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: #315966;
  margin-bottom: 12px;
}
.statistical-detail p,.numerical-detail p {
  font-size: 15px;
  line-height: 1.8;
  max-width: 80ch;
  margin: 0 0 14px;
}
.experiment-surface>.numerical-detail {
  padding: 19px 26px;
  margin: 0;
}
.analysis-block {
  padding: 25px 26px;
}
.analysis-block h3 {
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
  font-size: 23px;
  line-height: 1.35;
  color: #214a56;
  margin-bottom: 17px;
}
.analysis-note {
  margin-top: 17px;
}
.plot-legend {
  font-size: 14px;
  line-height: 1.5;
  color: #3f555e;
  gap: 11px 21px;
  margin-top: 8px;
}
.plot-legend i {
  width: 23px;
  height: 0;
  border-top: 3px solid;
  display: inline-block;
}
.plot-legend .legend-selected {
  width: 0;
  height: 15px;
  border-top: 0;
  border-left: 2px dashed;
}
.stats-strip {
  background: #fbfcf8;
  padding: 20px 26px;
  gap: 24px;
}
.small-stat>span {
  font-size: 14px;
  color: #455a63;
  line-height: 1.55;
}
.small-stat>strong {
  font-size: 27px;
  color: #214c59;
  line-height: 1.5;
}
.small-stat>small {
  font-size: 13px;
  line-height: 1.6;
  color: #526770;
}
.joint-cell {
  background: #edf2ee;
}
.experiment-actions {
  background: #fff;
  padding: 18px 24px;
}
.continuous-controls {
  padding: 13px 24px 20px;
  align-items: flex-start;
}
.continuous-controls .control-explanation {
  max-width: 37ch;
}
.trial-total {
  font-size: 14px;
  color: #445e67;
}
.observation {
  grid-template-columns: 135px minmax(0,1fr);
  padding: 25px 0 18px;
  margin: 17px 0 0;
  border-bottom: 1px solid #cdd8d8;
  max-width: none;
}
.observation>span {
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: .08em;
  color: #9c2942;
}
.observation p {
  font-size: 17px;
  line-height: 1.85;
  color: #314a54;
  max-width: 82ch;
}
.lab-discussion {
  max-width: 86ch;
  margin: 35px 0 30px;
  padding-top: 0;
  border: 0;
}
.lab-discussion h2 {
  font-size: 30px;
  line-height: 1.3;
  color: #203f4b;
  margin-bottom: 28px;
}
.reading-section {
  margin: 0 0 29px;
}
.reading-section h3 {
  font-family: Georgia,'Times New Roman',serif;
  font-size: 22px;
  font-weight: 400;
  line-height: 1.45;
  margin: 0 0 13px;
  color: #214f5d;
}
.lab-discussion p {
  font-family: Georgia,'Times New Roman',serif;
  font-size: 17px;
  line-height: 1.85;
  color: #2f424a;
  margin-bottom: 16px;
}
.model-details {
  font-size: 15px;
  line-height: 1.8;
  color: #435c64;
  max-width: 88ch;
}
.model-details>div {
  background: #eaf0ed;
  padding: 22px 25px;
  border-radius: 5px;
}
.model-details p {
  margin-bottom: 14px;
}
.model-details summary {
  font-size: 15px;
}
.gas-reference {
  background: #f6f8f2;
  border-bottom: 1px solid #d7dfdf;
}
.gas-reference h2 {
  color: #22444e;
}
.gas-reference p {
  color: #374f59;
}
.gas-timeline {
  background: #eef3ef;
}
.gas-timeline>span {
  color: #4c626a;
}
.gas-timeline>span b {
  color: #4c626a;
}
.gas-timeline .current {
  color: #8a263e;
}
.gas-canvases {
  background: #fff;
}
.particle-figure canvas {
  background: #fcfcf8;
  border-color: #a2b5b9;
  border-radius: 5px;
}
.particle-figure figcaption {
  font-size: 17px;
}
.gas-comparison-note {
  background: #fcf4e7;
  color: #573f29;
  font-size: 16px;
}
.gas-measurement-notes>p {
  color: #344c55;
}
.gas-measurement-notes h3:not(:first-child) {
  margin-top: 29px;
}
.gas-clock {
  color: #425b64;
}
.gas-measurement-notes .stats-strip {
  background: #fff;
}
.status-note {
  font-size: 15px;
  color: #596e76;
}
.page-footer {
  margin-top: 30px;
  border-top-color: #cdd8d8;
  padding: 18px 0;
}
.page-footer button {
  font-size: 14px;
}
.reset-lab {
  font-size: 13px !important;
  color: #4e646d;
}
@media (min-width:1600px) {
  .experiment-layout {
    grid-template-columns: minmax(0,1fr) 330px;
  }
  .experiment-layout.experiment-wide {
    grid-template-columns: minmax(0,1fr);
  }
  .control-panel {
    padding: 25px;
  }
  .page-content {
    padding-top: 38px;
  }
}
@media (max-width:1190px) {
  .experiment-layout {
    grid-template-columns: minmax(0,1fr);
  }
  .control-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 28px;
  }
  .control-panel>.panel-heading,.control-panel>.control-tip,.control-panel>.control-actions,.control-panel>.switch-control {
    grid-column: 1/-1;
  }
  .page-content {
    padding-left: 25px;
    padding-right: 25px;
  }
  .control-panel .control {
    margin-bottom: 10px;
  }
  .stage>svg {
    max-height: none;
  }
  .experiment-wide>.control-panel {
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width:767px) {
  .page-content {
    padding: 23px 16px 16px;
  }
  .topbar {
    padding-left: 66px;
    padding-right: 16px;
  }
  .chapter-heading h1 {
    font-size: 32px;
  }
  .opening-question,.lab-introduction {
    font-size: 16px;
  }
  .reading-nav {
    width: 100%;
    gap: 0;
  }
  .reading-nav button {
    font-size: 14px;
    margin-right: 14px;
    padding-right: 0;
  }
  .experiment-layout {
    display: flex;
    flex-direction: column;
  }
  .experiment-surface,.control-panel {
    width: 100%;
  }
  .control-panel {
    padding: 22px;
    gap: 20px;
    grid-template-columns: 1fr;
  }
  .control-panel>.control,.control-panel>.switch-control {
    grid-column: 1/-1;
  }
  .experiment-wide>.control-panel {
    grid-template-columns: 1fr;
  }
  .control-group:last-child {
    grid-column: auto;
  }
  .figure-heading {
    padding: 16px 18px;
    font-size: 12px;
  }
  .figure-tag {
    font-size: 12px;
  }
  .figure-explanation,.analysis-block,.results {
    padding: 22px 18px;
  }
  .figure-explanation h3,.analysis-block h3 {
    font-size: 22px;
  }
  .figure-explanation p,.result-reading,.sampling-note,.analysis-note,.analysis-note p {
    font-size: 16px;
  }
  .observation {
    display: block;
    padding-top: 23px;
  }
  .observation>span {
    display: block;
    margin-bottom: 10px;
  }
  .observation p {
    font-size: 16px;
  }
  .lab-discussion h2 {
    font-size: 28px;
  }
  .lab-discussion p {
    font-size: 17px;
  }
  .lab-discussion {
    margin-top: 30px;
  }
  .continuous-controls {
    padding: 12px 18px 20px;
  }
  .continuous-controls .control {
    min-width: 100%;
    max-width: 100%;
  }
  .result-heading {
    align-items: flex-start;
    gap: 15px;
  }
  .result-actions {
    gap: 8px;
  }
  .result-actions button {
    font-size: 13px;
  }
  .result-columns {
    font-size: 12px;
  }
  .probability-row {
    grid-template-columns: 48px minmax(52px,1fr) 59px 68px;
    gap: 8px;
  }
  .outcome-prob,.outcome-count {
    font-size: 13px;
  }
  .reading-section h3 {
    font-size: 22px;
  }
  .model-details {
    margin-left: 0;
    margin-right: 0;
  }
  .gas-clock {
    font-size: 14px;
  }
  .gas-timeline>span {
    font-size: 13px;
  }
  .gas-reference {
    padding: 18px;
  }
  .return-metrics .small-stat>strong {
    font-size: 24px;
  }
}
@media (max-width:420px) {
  .probability-row {
    grid-template-columns: 43px minmax(38px,1fr) 52px 59px;
    gap: 6px;
  }
  .result-columns {
    font-size: 12px;
  }
  .result-columns span:nth-child(2) {
    font-size: 12px;
  }
  .reading-nav button {
    font-size: 13px;
  }
  .figure-tag {
    display: none;
  }
}

  text-align: center;
  min-width: 0;
}
.qubit-transformation h3 {
  font: normal 22px/1.4 Georgia,serif;
  color: #214f5d;
  margin: 0 0 10px;
}
.qubit-transformation .bloch-point {
  max-width: 315px;
}
.qubit-transformation>section>strong {
  display: block;
  font: normal 21px/1.4 Georgia,serif;
  color: #214f5d;
  margin: 8px 0;
}
.qubit-transformation>section>span {
  display: block;
  font-size: 15px;
  line-height: 1.7;
  color: #43565e;
}
.qubit-transformation>section>span:last-child {
  color: #9c2942;
}
.qubit-transform-arrow {
  align-self: center;
  font-size: 27px;
  color: #9c2942;
}
.qubit-transformation>p {
  grid-column: 1/-1;
  font: 16px/1.7 Georgia,serif;
  color: #536770;
  margin: 18px 0 0;
}
.operation-examples {
  overflow: auto;
  padding: 0 27px 12px;
}
.operation-examples table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  line-height: 1.6;
  text-align: left;
}
.operation-examples th {
  font-weight: 600;
  color: #214f5d;
}
.operation-examples th,.operation-examples td {
  padding: 14px 10px;
  border-bottom: 1px solid #dce5e5;
}
.operation-examples thead th {
  font-size: 13px;
  color: #536770;
  background: #f2f6f5;
}
.operation-examples button {
  font-size: 14px;
  min-height: 38px;
}
@media (max-width:650px) {
  .qubit-transformation {
    gap: 7px;
    grid-template-columns: minmax(0,1fr) 17px minmax(0,1fr);
    padding: 10px 14px 20px;
  }
  .qubit-transformation h3 {
    font-size: 18px;
  }
  .qubit-transformation>section>strong {
    font-size: 18px;
  }
  .qubit-transformation>section>span {
    font-size: 13px;
  }
  .operation-examples {
    padding-left: 14px;
    padding-right: 14px;
  }
  .operation-examples table {
    min-width: 470px;
  }
  .qubit-transform-arrow {
    font-size: 20px;
  }
}
.circuit-node {
  height: 205px;
}
.circuit-cell:not(:last-child):after {
  top: 67px;
}
.selected-block-control {
  scroll-margin-top: 22px;
}

`),l=URL.createObjectURL(new Blob([o],{type:"text/csv;charset=utf-8"})),n=document.createElement("a");n.href=l,n.download=e,n.click(),setTimeout(()=>URL.revokeObjectURL(l),1e3)}var Su=M(W(),1),hn=M(G(),1),ki=(0,Su.createContext)(""),MI={moto:{intro:"Due particelle partono dallo stesso punto. Per prevedere dove si troveranno occorre conoscere anche la loro velocit\xE0. Il primo confronto segue due moti ben determinati; la raccolta sottostante mostra invece che cosa accade quando i dati della preparazione sono noti soltanto entro un intervallo.",title:"Quali dati servono per prevedere il moto?",sections:[{title:"Dalla velocit\xE0 alla posizione",paragraphs:["Il modello considera un moto lungo una retta, a velocit\xE0 costante. Se una particella parte da 2 m e percorre 3 m ogni secondo, dopo 4 s avr\xE0 compiuto uno spostamento di 3 \xD7 4 = 12 m. La posizione finale \xE8 dunque 2 + 12 = 14 m. Per una velocit\xE0 negativa lo spostamento si sottrae alla posizione di partenza: il segno distingue i due versi del moto.","Nel grafico inferiore del primo disegno il tempo cresce verso destra e la posizione si legge in verticale. Una retta pi\xF9 inclinata indica un cambiamento pi\xF9 rapido della posizione. Le rette di A e B iniziano nello stesso punto; se le velocit\xE0 sono uguali, coincidono per tutta la durata dell\u2019esperimento."]},{title:"Un intervallo di dati produce un intervallo di previsioni",paragraphs:["Impostiamo per A una velocit\xE0 di 3 m/s con incertezza di 0,5 m/s. Consideriamo cos\xEC possibili tutte le velocit\xE0 fra 2,5 e 3,5 m/s. Partendo da 0, dopo 4 s le posizioni estreme saranno 2,5 \xD7 4 = 10 m e 3,5 \xD7 4 = 14 m. La fascia colorata comprende le posizioni fra questi estremi. Con il passare del tempo si allarga, perch\xE9 piccole differenze di velocit\xE0 si accumulano nello spostamento.","L\u2019istogramma aggiunge molte preparazioni indipendenti. Il programma sceglie una posizione e una velocit\xE0 entro gli intervalli indicati, senza favorire alcuna parte di ciascun intervallo. Conta poi quante particelle arrivano in ogni tratto della retta. Questo criterio di scelta \xE8 un\u2019ipotesi ulteriore: conoscere soltanto gli estremi possibili non stabilisce quanto spesso compaia ciascun valore.","Confronta una raccolta di 1.000 preparazioni con una di 20.000, lasciando fisse le incertezze. La forma delle barre diventa pi\xF9 regolare, ma l\u2019intervallo delle posizioni possibili resta lo stesso. Un numero maggiore di simulazioni descrive meglio l\u2019incertezza assegnata; per restringerla occorrono dati iniziali pi\xF9 precisi."]}]},loschmidt:{intro:"Il gas viene preparato nella met\xE0 sinistra del recipiente e lasciato espandere. L\u2019esperimento si ferma prima di invertire le velocit\xE0. Da quella stessa configurazione partono due ritorni: uno usa tutti i dati disponibili, l\u2019altro introduce l\u2019imprecisione scelta. Il confronto rende osservabile il ruolo dell\u2019informazione necessaria a ricostruire il moto."},onde:{intro:"Le prime due curve rappresentano due onde con lo stesso periodo; la terza ne mostra la sovrapposizione. Manteniamo inizialmente uguali le ampiezze e cambiamo il ritardo reciproco. Potremo seguire lo stesso fenomeno attraverso le curve, la costruzione con le frecce e l\u2019intensit\xE0 risultante.",title:"Dalle oscillazioni alla figura di interferenza",sections:[{title:"Sommare i contributi nello stesso punto",paragraphs:["In ogni posizione, lo spostamento dell\u2019onda A si somma a quello dell\u2019onda B tenendo conto del segno. Se entrambe le onde si trovano a +1 rispetto all\u2019equilibrio, lo spostamento risultante \xE8 +2. Se una \xE8 a +1 e l\u2019altra a \u22121, la somma \xE8 0. La stessa operazione viene ripetuta lungo tutto il profilo e costruisce la terza curva.","L\u2019ampiezza \xE8 il massimo scostamento dall\u2019equilibrio. Il ritardo relativo stabilisce invece come si dispongono fra loro creste e valli. Con ritardo nullo, due onde uguali raggiungono insieme i massimi e i minimi. Con mezzo ciclo di differenza, a ogni cresta dell\u2019una corrisponde una valle dell\u2019altra: le oscillazioni si compensano in tutte le posizioni."]},{title:"Perch\xE9 un\u2019ampiezza doppia d\xE0 intensit\xE0 quadrupla",paragraphs:["Nel modello adottato, l\u2019intensit\xE0 \xE8 proporzionale all\u2019ampiezza moltiplicata per s\xE9 stessa. L\u2019onda A fissa il riferimento: ampiezza 1 e intensit\xE0 1. Due onde uguali e allineate danno ampiezza 1 + 1 = 2; l\u2019intensit\xE0 risultante vale quindi 2 \xD7 2 = 4. Con mezzo ciclo di ritardo l\u2019ampiezza risultante \xE8 1 \u2212 1 = 0 e anche l\u2019intensit\xE0 \xE8 nulla.","La costruzione con le frecce conserva sia l\u2019ampiezza, rappresentata dalla lunghezza, sia la fase, rappresentata dall\u2019orientazione. Si dispone l\u2019inizio della seconda freccia sulla punta della prima; la freccia che va dall\u2019origine alla punta finale rappresenta la somma. A un quarto di ciclo le due frecce sono perpendicolari. Con entrambe le ampiezze uguali a 1, il quadrato della lunghezza risultante vale 1 + 1 = 2: questa \xE8 l\u2019intensit\xE0 indicata dal simulatore."]},{title:"Un confronto che cambia una sola condizione",paragraphs:["Lascia l\u2019ampiezza B a 1 e confronta ritardo nullo, un quarto di ciclo e mezzo ciclo. Le intensit\xE0 delle onde separate rimangono entrambe 1, mentre l\u2019intensit\xE0 della somma passa per 4, 2 e 0. La relazione fra le oscillazioni \xE8 quindi un\u2019informazione necessaria alla previsione.","Riduci poi l\u2019ampiezza B a 0,5 mantenendo mezzo ciclo di ritardo. I contributi opposti hanno lunghezze diverse: resta un\u2019ampiezza di 1 \u2212 0,5 = 0,5 e un\u2019intensit\xE0 di 0,5 \xD7 0,5 = 0,25. La cancellazione completa richiede sia l\u2019opposizione di fase sia l\u2019uguaglianza delle ampiezze."]}]},fenditure:{intro:"Ogni evento aggiunge un punto allo schermo. La figura complessiva nasce dall\u2019accumulo di molti arrivi: le regioni pi\xF9 frequentate diventano riconoscibili e possono essere confrontate con la previsione. Cominciamo con una sola apertura, poi apriamo anche la seconda mantenendo fisse le altre condizioni.",title:"Come leggere la distribuzione degli arrivi",sections:[{title:"Il singolo punto e il profilo della raccolta",paragraphs:["Il punto sullo schermo indica la posizione di una rivelazione. L\u2019istogramma a destra divide lo schermo in piccoli intervalli e conta gli arrivi in ciascuno di essi. Una barra pi\xF9 lunga indica una parte maggiore della raccolta in quella regione. La linea bordeaux mostra le probabilit\xE0 previste per gli stessi intervalli.","Con 100 arrivi possono comparire irregolarit\xE0 marcate: alcuni intervalli ricevono pi\xF9 eventi di altri anche quando hanno probabilit\xE0 simili. Proseguendo fino a 10.000 o 100.000 arrivi, il profilo delle frequenze tende a diventare pi\xF9 stabile. Il numero maggiore di eventi migliora la lettura della distribuzione; la forma prevista dipende dall\u2019apparato."]},{title:"La larghezza del profilo e la distanza fra le frange",paragraphs:["Anche una sola fenditura produce un profilo allargato. Questo effetto prende il nome di diffrazione. La parte centrale \xE8 pi\xF9 popolata e, allontanandosi dal centro, compaiono regioni in cui gli arrivi diventano poco probabili. Restringendo la fenditura, il profilo si allarga.","Con due fenditure e una relazione di fase mantenuta, il profilo presenta un\u2019alternanza di regioni favorite e sfavorite: le frange di interferenza. Il profilo pi\xF9 ampio della singola apertura ne limita l\u2019estensione ed \xE8 chiamato inviluppo. Il controllo della larghezza modifica soprattutto questo profilo; il controllo della separazione modifica soprattutto la distanza fra le frange. Per distinguerli, varia un solo controllo alla volta.","La fase relativa sposta le frange sullo schermo. Ridurre la coerenza ne attenua invece il contrasto, cio\xE8 la differenza fra le regioni pi\xF9 e meno popolate. Al valore 0 rimane la somma dei profili dei due cammini. La scelta \xABSomma dei profili\xBB permette di confrontare direttamente questa previsione con quella che conserva l\u2019interferenza."]},{title:"Che cosa viene confrontato",paragraphs:["Le raccolte sono confrontate a parit\xE0 di numero di arrivi registrati nella finestra dello schermo. Il laboratorio mostra quindi dove si distribuiscono gli eventi, senza rappresentare l\u2019aumento o la diminuzione della quantit\xE0 totale di luce trasmessa dalle aperture. Quando modifichi l\u2019apparato, la raccolta corrente viene azzerata; puoi conservare prima il profilo per confrontarlo con il successivo."]}]},polarizzazione:{intro:"Riprendiamo la luce polarizzata usata nella lezione. Il disegno del campo mostra come oscilla la luce; la sfera di Bloch rappresenta la preparazione del qubit; le uscite A e B registrano gli esiti della misura. Il laboratorio mette in relazione queste tre descrizioni, mantenendone distinto il significato.",title:"Dalla polarizzazione alla scelta della misura",sections:[{title:"Due componenti dello stesso campo",paragraphs:["Guardiamo il fascio lungo la direzione di propagazione. Una polarizzazione H oscilla orizzontalmente, una polarizzazione V verticalmente. Nella diagonale a +45\xB0 il campo ha una componente orizzontale e una verticale di uguale ampiezza, che oscillano insieme. Sono componenti dello stesso campo elettrico.","Il disegno traccia le posizioni raggiunte dalla punta del campo durante un\u2019oscillazione. Per una polarizzazione lineare si ottiene un segmento. Se le due componenti acquistano uno sfasamento, la punta pu\xF2 percorrere un\u2019ellisse; con ampiezze uguali e un quarto di ciclo di differenza percorre un cerchio. Le figure descrivono l\u2019oscillazione del campo di un fascio classico, non il tragitto di un pacchetto di luce nello spazio."]},{title:"Misurare un pacchetto alla volta",paragraphs:["Con l\u2019analizzatore a 0\xB0, l\u2019uscita A corrisponde alla polarizzazione H e l\u2019uscita B alla polarizzazione V. La preparazione H conduce sempre ad A nel modello ideale; la preparazione V conduce sempre a B. La diagonale a +45\xB0 assegna invece uguale probabilit\xE0 ai due esiti.","Ogni prova prepara un nuovo pacchetto e registra un solo esito. Su molte prove con la diagonale ci aspettiamo circa met\xE0 degli arrivi in A e met\xE0 in B. La scomposizione del campo non significa che ciascun pacchetto sia registrato per met\xE0 in ogni uscita. Il 50% descrive la probabilit\xE0 dei singoli esiti e il comportamento di una raccolta numerosa."]},{title:"La stessa ripartizione pu\xF2 provenire da preparazioni diverse",paragraphs:["Prepara prima +45\xB0 e poi \u221245\xB0, lasciando l\u2019analizzatore a 0\xB0. Entrambe le preparazioni danno probabilit\xE0 50% e 50%. Sulla sfera occupano per\xF2 due punti opposti dell\u2019equatore. La stessa altezza rispetto all\u2019asse H/V spiega l\u2019uguaglianza delle probabilit\xE0 in quella misura; la diversa posizione conserva la differenza fra gli stati.","Ruota ora l\u2019analizzatore a 45\xB0. L\u2019uscita A legge la diagonale +45\xB0 e B la diagonale perpendicolare \u221245\xB0. La prima preparazione produce A con certezza, la seconda B con certezza. Cambiare la misura rende quindi osservabile una differenza che la precedente scelta non distingueva.","La preparazione circolare offre un ulteriore confronto: tutte le orientazioni lineari dell\u2019analizzatore danno 50% e 50%. Questo risultato non identifica lo stato con una scelta casuale fra H e V. La preparazione circolare conserva una relazione precisa fra le componenti; altre operazioni, prima della misura, possono renderla osservabile. Il laboratorio mostra qui soltanto analizzatori lineari."]}]}};function TI(){let e=MI[(0,Su.useContext)(ki)];return e?(0,hn.jsx)("p",{className:"lab-introduction",children:e.intro}):null}function kI(){let e=MI[(0,Su.useContext)(ki)];return e?.sections?(0,hn.jsxs)("section",{className:"lab-discussion",children:[(0,hn.jsx)("h2",{children:e.title}),e.sections.map(t=>(0,hn.jsxs)("section",{className:"reading-section",children:[(0,hn.jsx)("h3",{children:t.title}),t.paragraphs.map((a,o)=>(0,hn.jsx)("p",{children:a},o))]},t.title))]}):null}var DI=M(W(),1);var PI=M(G(),1),uP={"Prove al secondo":"Regola soltanto la rapidit\xE0 della raccolta sullo schermo. Le probabilit\xE0 di ciascuna prova restano le stesse.","Arrivi al secondo":"Determina quanti eventi vengono aggiunti ogni secondo di animazione. A parit\xE0 di configurazione, la distribuzione prevista non cambia.","Analizzatore 1":"L\u2019analizzatore separa due polarizzazioni perpendicolari. A 0\xB0 legge orizzontale e verticale; a 45\xB0 legge le due diagonali. A indica l\u2019uscita lungo l\u2019orientazione scelta, B quella perpendicolare.","Analizzatore 2":"Questa orientazione riguarda la misura sul secondo pacchetto della coppia. Pu\xF2 essere diversa da quella del primo analizzatore.","Fase relativa":"Indica di quanto un contributo \xE8 avanti nel ciclo rispetto all\u2019altro. Un giro di 360\xB0 \xE8 un ciclo completo; 90\xB0 \xE8 un quarto di ciclo e 180\xB0 \xE8 mezzo ciclo.","Numero di particelle":"Ogni punto \xE8 una particella simulata. Cambiare il numero prepara un nuovo esperimento; il moto precedente viene azzerato."},cP={moto:{"Posizione iniziale":"\xC8 il punto da cui partono sia A sia B. Il valore 0 \xE8 l\u2019origine scelta per misurare le distanze, non un bordo del tavolo.","Velocit\xE0 A":"Indica lo spostamento di A in un secondo. Un valore positivo porta verso destra; un valore negativo verso sinistra; con 0 la particella resta ferma.","Velocit\xE0 B":"B parte dallo stesso punto di A, ma pu\xF2 avere una velocit\xE0 diversa. I due moti vengono calcolati separatamente.","Incertezza sulla velocit\xE0 A":"Specifica quanto la velocit\xE0 pu\xF2 differire dal valore centrale, in entrambi i versi. Per 3 m/s con incertezza 0,5 m/s consideriamo tutte le velocit\xE0 da 2,5 a 3,5 m/s.","Particelle indipendenti":"Sono ripetizioni della preparazione di A. Ogni particella riceve una propria posizione e una propria velocit\xE0 iniziali negli intervalli scelti.","Incertezza iniziale sulla posizione":"Agisce soltanto sulla raccolta rappresentata nell\u2019istogramma. Con valore 1 m, le posizioni iniziali si estendono da un metro prima a un metro dopo il punto centrale."},loschmidt:{"Durata minima di ciascuna fase":"\xC8 il tempo di visione, misurato con un orologio reale. Espansione e ritorno hanno la stessa durata impostata; il calcolo pu\xF2 richiedere pi\xF9 tempo su un dispositivo lento.","Tempo simulato prima dell\u2019inversione":"Stabilisce quanto evolve fisicamente il gas prima del cambio di verso. Le unit\xE0 di tempo, indicate con u.t., appartengono al modello e non sono secondi reali.","Interazione fra particelle":"Nella prima opzione, particelle vicine si respingono e modificano le rispettive velocit\xE0. Nella seconda si attraversano senza influenzarsi; rimangono i rimbalzi sulle pareti.","Origine dell\u2019imprecisione":"La registrazione incompleta conserva una direzione arrotondata. L\u2019errore d\u2019inversione parte invece dalla direzione nota e la altera nel momento in cui si cambia il verso del moto.","Passo della registrazione angolare":"Con un passo di 5\xB0, il programma conserva soltanto direzioni multiple di 5\xB0: per esempio 12\xB0 diventa 10\xB0. L\u2019inversione usa questo dato arrotondato. Il valore 0 mantiene la direzione completa.","Massima deviazione angolare":"Dopo il cambio di verso, la direzione viene ruotata di un piccolo angolo scelto entro il limite indicato, in un senso oppure nell\u2019altro. Con 0\xB0 non si introduce alcuna deviazione.","Velocit\xE0 interessate":"Sceglie a quante particelle applicare l\u2019imprecisione. Tutte le altre velocit\xE0 vengono invertite accuratamente.","Rappresentazione del gas":"\xABParticelle\xBB mostra i punti; \xABDensit\xE0\xBB raggruppa i conteggi in regioni; \xABVelocit\xE0\xBB aggiunge segmenti dal punto verso la direzione del moto. Cambia il disegno, mentre l\u2019evoluzione resta la stessa."},onde:{"Ritardo relativo":"Le due onde hanno lo stesso periodo, cio\xE8 impiegano lo stesso tempo a compiere un\u2019oscillazione. Qui si regola lo spostamento di un ciclo rispetto all\u2019altro: 90\xB0 corrisponde a un quarto di periodo, 180\xB0 a mezzo periodo.",Confronti:"Questi tre casi permettono di seguire il passaggio dal rinforzo alla cancellazione. Mantieni inizialmente uguali le ampiezze delle due onde.","Ampiezza dell\u2019onda B":"L\u2019ampiezza \xE8 il massimo scostamento dall\u2019equilibrio. L\u2019onda A ha ampiezza 1: con B = 1 i contributi sono uguali, con B = 0 rimane soltanto A."},fenditure:{Aperture:"Con una fenditura si osserva l\u2019allargamento del profilo prodotto da una singola apertura. Con due fenditure si pu\xF2 studiare anche il confronto fra i due contributi.",Combinazione:"\xABCon interferenza\xBB conserva la relazione di fase fra i contributi. \xABSomma dei profili\xBB somma le probabilit\xE0 dei due cammini, come nel caso in cui siano distinguibili. Con una sola apertura questa scelta non ha effetto.","Larghezza delle fenditure":"\xC8 l\u2019ampiezza fisica di ciascuna apertura. Un micrometro (\u03BCm) \xE8 un millesimo di millimetro. Restringere l\u2019apertura allarga il profilo sullo schermo.","Separazione delle fenditure":"\xC8 la distanza fra i centri delle due aperture. Interviene sulla distanza fra le frange chiare e scure; non modifica la larghezza di ciascuna apertura.","Lunghezza d\u2019onda":"\xC8 la distanza fra due creste successive dell\u2019onda. Un nanometro (nm) \xE8 un milionesimo di millimetro; per la luce visibile, lunghezze d\u2019onda diverse corrispondono a colori diversi.","Distanza dello schermo":"Allontanare lo schermo dilata la figura. Nel disegno l\u2019apparato rimane schematico: le distanze fisiche sono quelle impostate nei controlli.","Coerenza dei due contributi":"La coerenza indica quanto viene mantenuta la relazione di fase. Con 1 il modello conserva tutta l\u2019interferenza; con 0 rimane la somma dei profili. I valori intermedi riducono la differenza fra zone chiare e scure."},polarizzazione:{"Preparazioni note":"H indica la polarizzazione orizzontale, V quella verticale. +45\xB0 e \u221245\xB0 sono le due diagonali. Ogni scelta ripristina componenti che oscillano insieme.","Orientazione prima dello sfasamento":"Con fase nulla questo \xE8 l\u2019angolo della polarizzazione lineare. Regola il peso delle componenti orizzontale e verticale. Se poi introduci una fase, la punta del campo pu\xF2 descrivere un\u2019ellisse e non ha pi\xF9 un\u2019unica direzione fissa.","Orientazione dell\u2019analizzatore":"A 0\xB0 le uscite A e B corrispondono rispettivamente a H e V. A 45\xB0 corrispondono alle diagonali +45\xB0 e \u221245\xB0. Ruotare l\u2019analizzatore cambia la domanda posta alla stessa preparazione.","Fase fra le componenti H e V":"Regola lo sfasamento delle due componenti dello stesso campo. Con 0\xB0 oscillano insieme; con 180\xB0 sono in opposizione; con ampiezze uguali e 90\xB0 si ottiene una polarizzazione circolare."}};function ef({label:e}){let t=(0,DI.useContext)(ki),a=cP[t]?.[e]??uP[e];return a?(0,PI.jsx)("p",{className:"control-explanation",children:a}):null}var A=M(G(),1),C={red:"#9c2942",blue:"#166477",green:"#a76010",ink:"#25343b",gray:"#536770",line:"#d7dfdf",pale:"#f5f5f0"},T=(e,t=1)=>(Math.abs(e)<.5*10**-t?0:e).toLocaleString("it-IT",{maximumFractionDigits:t,minimumFractionDigits:t});function Re({label:e,value:t,min:a=0,max:o=100,step:l=1,unit:n="",onChange:r,disabled:i=!1}){let s=(0,Tt.useId)(),u=(0,Tt.useRef)(null);return(0,Tt.useEffect)(()=>{let d=u.current?.querySelector('[role="slider"]');d?.setAttribute("aria-labelledby",s),d?.setAttribute("aria-valuetext",T(t,l<1?String(l).split(".")[1]?.length||1:0)+n)},[s,t,n,l]),(0,A.jsxs)("div",{className:"control",ref:u,children:[(0,A.jsxs)("div",{className:"control-label",children:[(0
