name: Verify and publish Quantum Lab

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test models, catalogue, configuration and distribution
        run: npm test
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5
      - name: Build with the actual Pages URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Install browser test tools (not runtime dependencies)
        run: |
          python3 -m pip install 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
      - name: Browser regression over HTTP with CSP enabled
        run: npm run test:browser
      - name: Upload only the static distribution
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@v5
