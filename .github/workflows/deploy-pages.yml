name: Pubblica Laboratorio su GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verifica e genera il laboratorio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v6

      - name: Prepara Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Prepara pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Installa le dipendenze fissate
        run: pnpm install --frozen-lockfile

      - name: Verifica tipi, modelli e sito generato
        run: pnpm run check

      - name: Configura GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Prepara il sito per la pubblicazione
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Pubblica il laboratorio
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
